<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Habit Tracker</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>


	<div class="header">
		<a href="/?page=default" class="logo" onclick="openPage('default', this)">Habit Tracker</a>
		<div class="header-right">
			<a class="tablink" href="/?page=Home" onclick="openPage('Home', this)">Home</a>
			<a class="tablink" href="/?page=Login" onclick="openPage('Login', this)">Login</a>
		</div>
	</div>

	<div id="default" class="tabcontent">
		<button id="openHabitModal" class="new-habit-btn">New +</button>

		<div class="modal-overlay" id="habitModal">
			<div class="modal-box">

				<div class="modal-header">
					<h2>Create new Habit</h2>
					<button class="close-btn" id="closeHabitModal">&times</button>
				</div>

				<form id="habitForm">
					<div class="form-group">
						<label for="habitName">Habit Name</label>
						<input
							type="text"
							id="habitName"
							name="habit_name"
							placeholder="Enter habit name..."
							required
						>
					</div>

					<div class="form-group">
						<label>Repeat</label>
						<div class="recurrence-options">

							<label class="option">
								<input type="radio" name="recurrence" value="daily">
								<span>Daily</span>
							</label>

							<label class="option">
								<input type="radio" name="recurrence" value="weekly">
								<span>Weekly</span>
							</label>

							<label class="option">
								<input type="radio" name="recurrence" value="monthly">
								<span>Monthly</span>
							</label>

							<label class="option">
								<input type="radio" name="recurrence" value="specific_days">
								<span>Specific Days</span>
							</label>

							<label class="option">
								<input type="radio" name="recurrence" value="interval">
								<span>Specific Interval</span>
							</label>
						</div>
					</div>

					<div id="recurrenceSettings"></div>

					<div class="modal-actions">
						<button type="button" class="cancel-btn" id="cancelHabit"> Cancel </button>
						<button type="submit" class="save-btn"> Create Habit </button>
					</div>
				</form>
			</div>
		</div>










		<div class="calendar">
			<div class="calendar-header">
				<button id="prev-month"><</button>
				<div id="month-year"></div>
				<button id="next-month">></button>
			</div>
			<div class="calendar-body">
				<div class="calendar-weekdays">
					<div>Mon</div>
					<div>Tue</div>
					<div>Wed</div>
					<div>Thu</div>
					<div>Fri</div>
					<div>Sat</div>
					<div>Sun</div>
				</div>
				<div class="calendar-dates">
				</div>
			</div>
		</div>
		<script src="static/calendar_script.js"></script>
	</div>

	<div id="Login" class="tabcontent">
		<p> Login </p>
	</div>










	<div id="Home" class="tabcontent">
		<ul>
			{% for task in tasks %}
				<li>
					<form method="POST" action="{{ url_for('complete_tasks') }}">
						<input type="checkbox" id="{{ loop.index }}" name="taskCheckbox" value="{{ loop.index }}" onclick="this.form.submit()">
						
						<label for="{{ loop.index }}">{{ task }}</label>
					</form>
					
					<form method="POST" action="{{ url_for('delete_tasks') }}">
						<input type="hidden" name="taskCheckbox" value="{{ loop.index }}">
						<button type="submit">Delete</button>
					</form>
				</li>
			{% endfor %}
		</ul>
		<script>
				function deleteTask(index) {
					document.getElementById(index).checked = false;
					document.forms[0].submit();
				}
		</script>
		<form method="POST" action="{{ url_for('add_task') }}">
			<label for="newTask">Add Task:</label>
			<input type="text" id="newTask" name="newTask" required>
			<button type="submit">Add</button>
		</form>
	</div>


	<script>
		function openPage(name, elmnt) {
			var i, tabcontent, tablinks;
			tabcontent = document.getElementsByClassName("tabcontent");
			for (i = 0; i < tabcontent.length; i++) {
				tabcontent[i].style.display = "none";
			}

			tablinks = document.getElementsByClassName("tablink");
			for (i = 0; i < tablinks.length; i++) {
				tablinks[i].style.backgroundColor = "";
			}
		
			document.getElementById(name).style.display = "block";
		}
	
		window.onload = function() {
			const params = new URLSearchParams(window.location.search);
			const page = params.get('page') || 'default';
			openPage(page, null);
		};
	</script>


<script src="{{ url_for('static', filename='new_habit_script.js') }}"></script>
</body>
</html>
